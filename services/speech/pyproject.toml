[project]
name = "night-speech"
version = "0.0.1"
description = "Voz do Night: Kokoro (falar) e faster-whisper (ouvir), locais, por JSON em stdin/stdout"
requires-python = ">=3.12,<3.13"
dependencies = [
  "kokoro>=0.9",
  "faster-whisper>=1.1",
  "sounddevice>=0.5",
  "soundfile>=0.12",
  "numpy",
  "noisereduce>=3",
  "sherpa-onnx>=2.0",
]
